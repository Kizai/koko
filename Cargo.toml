[workspace]
members = [
    "crates/koko-proto",
    "crates/koko-p2p",
    "crates/koko-capture",
    "crates/koko-input",
    "crates/koko-daemon",
    "crates/koko-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
koko-p2p = { path = "crates/koko-p2p" }
koko-proto = { path = "crates/koko-proto" }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
