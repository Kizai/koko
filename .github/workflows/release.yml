name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build, sign and verify only; they never create a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS release
    runs-on: macos-latest
    timeout-minutes: 60
    # Add required reviewers to this environment so signing secrets are not used by
    # unreviewed runs.
    environment: release
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check tag and version
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 | plutil -extract packages.0.version raw -)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            # A suffix such as v0.1.26-ci runs the build without publishing.
            version="${tag%%-*}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version." >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SPARKLE_UPDATE_PRIVATE_KEY: ${{ secrets.SPARKLE_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/koko-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$SIGNING_P12_BASE64" | openssl base64 -d > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$SIGNING_P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          # Keep the runner's own keychains and add the temporary one ahead of them.
          existing=()
          while IFS= read -r line; do
            path="$(printf '%s' "$line" | sed 's/^[[:space:]]*//; s/"//g')"
            [[ -n "$path" ]] && existing+=("$path")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(.*\)"/\1/p')"
          preferred="$(printf '%s\n' "$identity" | grep -m 1 '^KoKo ' || true)"
          identity="${preferred:-$(printf '%s\n' "$identity" | head -n 1)}"
          if [[ -z "$identity" ]]; then
            echo "The imported p12 has no code-signing identity." >&2
            exit 1
          fi
          echo "KOKO_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Sparkle reads its Ed25519 private key from the same keychain.
          key="$(printf '%s' "$SPARKLE_UPDATE_PRIVATE_KEY" | tr -d '\r\n')"
          security add-generic-password -A \
            -a "io.github.kizai.koko.updates" \
            -s "https://sparkle-project.org" \
            -w "$key" "$keychain"
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Build, sign and package
        run: KOKO_UPDATE_ASSETS=1 ./scripts/build-macos.sh

      - name: Verify artifacts
        run: |
          set -euo pipefail
          app="target/koko-macos/Koko.app"
          dmg="target/koko-macos/Koko-$VERSION.dmg"
          updates="target/koko-macos/updates/$VERSION"
          codesign --verify --deep --strict "$app"
          hdiutil verify -quiet "$dmg"
          test -s "$updates/Koko-$VERSION.zip"
          test -s "$updates/appcast.xml"
          shasum -a 256 "$dmg" "$updates/Koko-$VERSION.zip" > target/koko-macos/SHA256SUMS
          ls -lh "$dmg" "$updates"

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg="target/koko-macos/Koko-$VERSION.dmg"
          zip="target/koko-macos/updates/$VERSION/Koko-$VERSION.zip"
          appcast="target/koko-macos/updates/$VERSION/appcast.xml"
          checksums="target/koko-macos/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$zip" "$appcast" "$checksums" --clobber
          else
            # 0.x test releases are marked as prereleases; drop this flag at 1.0.
            gh release create "$GITHUB_REF_NAME" "$dmg" "$zip" "$appcast" "$checksums" \
              --title "KoKo $VERSION" --generate-notes --prerelease
          fi

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/koko-signing.keychain-db" 2>/dev/null || true
