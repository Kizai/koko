[package]
name = "koko-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
iroh.workspace = true
koko-p2p.workspace = true
koko-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
koko-capture.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Authorization", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
koko-host-windows = { path = "../koko-host-windows" }
