[workspace]
members = [
    "crates/koko-proto",
    "crates/koko-p2p",
    "crates/koko-capture",
    "crates/koko-input",
    "crates/koko-daemon",
    "crates/koko-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.21"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
if-addrs = "0.15"
iroh = { version = "1.5.0", default-features = false, features = ["tls-ring"] }
koko-capture = { path = "crates/koko-capture" }
koko-p2p = { path = "crates/koko-p2p" }
koko-proto = { path = "crates/koko-proto" }
mdns-sd = { version = "0.22", default-features = false, features = ["async"] }
rmcp = { version = "3.11", features = ["transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
